name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['locked', 'lowest', 'latest']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Resolve lowest compatible dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Resolve latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Run tests
        if: matrix.dependencies != 'lowest'
        run: composer test -- --fail-on-deprecation --fail-on-warning

      - name: Run tests with legacy dependency diagnostics
        if: matrix.dependencies == 'lowest'
        run: composer test -- --display-deprecations --fail-on-warning

  quality:
    name: Quality and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer dump-autoload --optimize --strict-psr
      - run: composer lint
      - run: composer analyse
      - run: composer check-docs
      - run: composer check-package

  laravel:
    name: Laravel 12 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=tests/Integration/Laravel --no-interaction --prefer-dist --no-progress
      - run: php tests/Integration/Laravel/verify.php
