name: Tests

on:
  push:
    branches-ignore: ['badges']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['locked', 'lowest', 'latest']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Resolve lowest compatible dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Resolve latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Run tests
        id: run-tests
        if: matrix.dependencies != 'lowest'
        run: composer test -- --fail-on-deprecation --fail-on-warning --log-junit "${{ runner.temp }}/junit.xml"

      - name: Run tests with legacy dependency diagnostics
        if: matrix.dependencies == 'lowest'
        run: composer test -- --display-deprecations --fail-on-warning

      - name: Generate test count badge
        if: >-
          !cancelled() && matrix.php == '8.4' && matrix.dependencies == 'locked'
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
        run: python3 .github/scripts/test-count-badge.py "${{ runner.temp }}/junit.xml" "${{ runner.temp }}/test-count.json" "$TEST_OUTCOME"

      - name: Upload test count badge
        if: >-
          !cancelled() && matrix.php == '8.4' && matrix.dependencies == 'locked'
          && github.ref == 'refs/heads/master'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: test-count-badge
          path: ${{ runner.temp }}/test-count.json
          if-no-files-found: error
          retention-days: 7

  test-count:
    name: Publish test count badge
    needs: tests
    if: >-
      !cancelled() && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: test-count-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: test-count-badge
          path: ${{ runner.temp }}/test-count-badge
      - uses: actions/github-script@v9
        env:
          BADGE_PATH: ${{ runner.temp }}/test-count-badge/test-count.json
        with:
          script: |
            const publish = require('./.github/scripts/publish-test-count.cjs');
            await publish({ github, context, core });

  quality:
    name: Quality and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer dump-autoload --optimize --strict-psr
      - run: composer lint
      - run: composer analyse
      - run: composer check-docs
      - run: python3 .github/scripts/test_test_count_badge.py
      - run: node --test .github/scripts/publish-test-count.test.cjs
      - run: composer check-package

  laravel:
    name: Laravel 12 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=tests/Integration/Laravel --no-interaction --prefer-dist --no-progress
      - run: php tests/Integration/Laravel/verify.php
